name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The registered Kernels release does not yet provide the required tracer API.
      - name: Check out PlanktonKernels
        uses: actions/checkout@v7
        with:
          repository: JuliaOcean/PlanktonKernels.jl
          ref: main
          path: .ci/PlanktonKernels.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Use development PlanktonKernels
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.develop(path=".ci/PlanktonKernels.jl")
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
      - uses: codecov/codecov-action@v7
        if: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
